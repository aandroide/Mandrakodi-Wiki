name: Aggiorna partite

on:
  # Esecuzione manuale
  workflow_dispatch:

  # Ogni 30 minuti
  schedule:
    - cron: "7,37 * * * *"

  # Esecuzione anche ad ogni modifica del repository
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt

      - name: Estrai partite
        run: |
          python scraper.py

      - name: Verifica partite.json
        run: |
          test -f partite.json
          python -m json.tool partite.json > /dev/null

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

