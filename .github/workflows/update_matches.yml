name: Aggiorna Palinsesto Partite

on:
  schedule:
    # Esegue ogni giorno alle 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub Web

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permessi necessari per fare il commit nel repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Esegui Script Python
        run: python scripts/scraper.py

      - name: Commit e Push del file JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/partite.json
          git status
          git commit -m "Automated: Aggiornamento partite.json [skip ci]" || exit 0
          git push
