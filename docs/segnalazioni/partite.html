<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partite — Serie A, B, C</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #f9f9f9;
      color: #222;
    }
    h1 { text-align: center; margin-bottom: 0.2em; }
    p.subtitle { text-align: center; color: #666; margin-top: 0; }
    .competizione-titolo {
      margin-top: 2rem;
      padding: 0.5rem 0;
      border-bottom: 2px solid #333;
      font-size: 1.3rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      background: #fff;
    }
    th, td {
      padding: 0.6rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }
    th {
      background: #333;
      color: #fff;
      font-weight: 600;
    }
    tr:hover { background: #f0f7ff; }
    .data-col { white-space: nowrap; width: 140px; }
    .casa { font-weight: 600; }
    .ospite { color: #444; }
    .risultato { font-weight: 700; color: #1a73e8; text-align: center; width: 80px; }
    .loading { text-align: center; padding: 3rem; color: #888; }
    .errore { text-align: center; padding: 2rem; color: #c00; }
  </style>
</head>
<body>
  <h1>Calendario Partite</h1>
  <p class="subtitle">Serie A &middot; Serie B &middot; Serie C</p>
  <div id="contenuto">
    <p class="loading">Caricamento partite...</p>
  </div>

  <script>
    async function caricaPartite() {
      var contenitore = document.getElementById("contenuto");
      try {
        var resp = await fetch("partite.json");
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        var partite = await resp.json();

        var gruppi = {};
        for (var i = 0; i < partite.length; i++) {
          var p = partite[i];
          var comp = p.competizione || "Altro";
          if (!gruppi[comp]) gruppi[comp] = [];
          gruppi[comp].push(p);
        }

        var html = "";
        var ordine = ["Serie A", "Serie B", "Serie C"];
        var chiavi = [];
        for (var i = 0; i < ordine.length; i++) {
          if (gruppi[ordine[i]]) chiavi.push(ordine[i]);
        }
        var keys = Object.keys(gruppi);
        for (var i = 0; i < keys.length; i++) {
          var found = false;
          for (var j = 0; j < ordine.length; j++) {
            if (keys[i] === ordine[j]) { found = true; break; }
          }
          if (!found) chiavi.push(keys[i]);
        }

        for (var c = 0; c < chiavi.length; c++) {
          var comp = chiavi[c];
          html += '<h2 class="competizione-titolo">' + comp + '</h2>';
          html += '<table><thead><tr>';
          html += '<th class="data-col">Data / Ora</th>';
          html += '<th>Casa</th>';
          html += '<th>Risultato</th>';
          html += '<th>Ospite</th>';
          html += '</tr></thead><tbody>';

          var partiteComp = gruppi[comp];
          for (var i = 0; i < partiteComp.length; i++) {
            var p = partiteComp[i];
            html += '<tr>';
            html += '<td class="data-col">' + p.data + ' ' + p.ora + '</td>';
            html += '<td class="casa">' + p.casa + '</td>';
            html += '<td class="risultato">' + (p.risultato || "\u2014") + '</td>';
            html += '<td class="ospite">' + p.ospite + '</td>';
            html += '</tr>';
          }

          html += '</tbody></table>';
        }

        if (!html) {
          html = '<p class="errore">Nessuna partita trovata.</p>';
        }

        contenitore.innerHTML = html;
      } catch (err) {
        contenitore.innerHTML = '<p class="errore">Errore: ' + err.message + '</p>';
        console.error(err);
      }
    }

    caricaPartite();
  </script>
</body>
</html>
