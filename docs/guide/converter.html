<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Web Convertitore per WireGuard</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; background: #f4f4f9; }
    textarea { width: 100%; height: 180px; font-family: monospace; margin-top: 5px; }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button.dl { background: #007bff; display: none; }
    .box { margin-bottom: 20px; }
  </style>
</head>
<body>

  <h2>Convertitore per Wireguard</h2>
  
  <div class="box">
    <label><strong>Carica file .conf:</strong></label><br>
    <input type="file" id="fileInput" accept=".conf,.txt">
  </div>

  <div class="box">
    <label><strong>Input:</strong></label>
    <textarea id="inputConfig" placeholder="Incolla testo conf..."></textarea>
    <button onclick="cleanConfig()">Converti</button>
  </div>

  <div class="box">
    <label><strong>Output:</strong></label>
    <textarea id="outputConfig" readonly></textarea>
    <button id="downloadBtn" class="dl" onclick="downloadConf()">Scarica file</button>
  </div>

  <script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) { document.getElementById('inputConfig').value = e.target.result; };
      reader.readAsText(file);
    });

    function cleanConfig() {
      const input = document.getElementById('inputConfig').value;
      const ignored = ['S1', 'S2', 'Jc', 'Jmin', 'Jmax', 'H1', 'H2', 'H3', 'H4'];
      const lines = input.split(/\r?\n/);
      const filtered = lines.filter(line => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('[')) return true;
        return !ignored.includes(trimmed.split('=')[0].trim());
      });
      const output = filtered.join('\n');
      document.getElementById('outputConfig').value = output;
      if (output.trim()) document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function downloadConf() {
      const text = document.getElementById('outputConfig').value;
      const blob = new Blob([text], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.download = 'wireguard.conf';
      a.href = window.URL.createObjectURL(blob);
      a.click();
    }
  </script>

</body>
</html>
